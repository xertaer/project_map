{% extends 'base.html' %}

{% block content %}
<div style="text-align: center; margin-bottom: 40px;">
    <h1 style="font-family: 'Times New Roman', serif; font-size: 2.5rem;">👥 Галерея великих первопроходцев</h1>
    <p style="color: #6d5843; font-style: italic;">Летопись подвигов и открытий сухопутных и морских экспедиций</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px;">
    {% for d in discoverers %}
    <div style="background: #fbf4e6; border: 1px solid #c4a482; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-column: column; justify-content: space-between;">
        <div>
            <h3 style="color: #3e2a14; margin-top: 0; font-family: 'Times New Roman', serif; font-size: 1.4rem; border-bottom: 1px solid #e2d3b5; padding-bottom: 5px;">{{ d.name }}</h3>
            <h5 style="color: #8b5a2b; font-size: 1rem; margin: 10px 0;">📍 На карте: {{ d.place }}</h5>
            <p style="color: #554331; font-size: 0.95rem; line-height: 1.5;">{{ d.bio }}</p>
        </div>
        <div style="background: #e2d3b5; padding: 10px; border-radius: 4px; font-size: 0.9rem; color: #3e2a14; margin-top: 15px; border-left: 4px solid #4a6b52;">
            <strong>Достижение:</strong> {{ d.achievement }}
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
