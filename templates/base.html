<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧭 Географические открытия России</title>
    <style>
        body {
            background-color: #f5ebe0;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }
        /* Красивое винтажное меню */
        .navbar {
            background-color: #3e2a14;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .navbar-brand {
            color: #ffcc00;
            font-family: 'Times New Roman', serif;
            font-size: 1.6rem;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links {
            display: flex;
            gap: 25px;
        }
        .nav-links a {
            color: #e2d3b5;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #ffcc00;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="navbar-brand">🗺️ ВЕЛИКИЕ ЭКСПЕДИЦИИ</a>
        <div class="nav-links">
            <a href="/">Карта открытий</a>
            <a href="/discoverers">Список личностей</a>
            <a href="/about">О проекте</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
