<!-- templates/index.html -->
{% extends 'base.html' %}

{% block content %}
<style>
    .hint-panel {
        background: #fdf8eb;
        border: 2px dashed #c4a482;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        margin-bottom: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        width: 100%;
        box-sizing: border-box;
    }
    .hint-text {
        color: #8b5a2b;
        font-family: 'Times New Roman', serif;
        font-size: 1.3rem;
        margin: 0;
    }

    .map-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-bottom: 30px;
    }

    .map-wrapper {
        position: relative;
        background: #0f2b46;
        border: 4px double #8b5a2b;
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 1140px;
    }

    .world-svg {
        width: 100%;
        height: auto;
        border-radius: 6px;
        display: block;
        background-color: #ebdcb9;
    }

    /* Стиль маркеров */
    .marker-group { cursor: pointer; }
    .marker-circle {
        fill: #ffcc00; 
        stroke: #d9381e;
        stroke-width: 1.5px;
        transition: all 0.2s ease-in-out;
        filter: drop-shadow(0px 0px 4px #ffcc00);
        /* 🎯 ЖЕСТКО ЗАДАЕМ МАЛЕНЬКИЙ РАЗМЕР ДЛЯ ВСЕХ ТОЧЕК НА КАРТЕ: */
        r: 5.5px !important;
    }
    .marker-group:hover .marker-circle {
        fill: #ffffff;
        stroke: #ffcc00;
        /* Размер при наведении тоже делаем аккуратным и компактным */
        r: 7.5px !important;
        filter: drop-shadow(0px 0px 7px #ffffff);
    }
    .marker-click-area { fill: transparent; }
    .marker-tip {
        display: none;
        font-family: 'Georgia', serif;
        font-size: 14px;
        fill: #ffffff;
        font-weight: bold;
        filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.9));
    }
    .marker-group:hover .marker-tip { display: block; }

    /* Свиток */
    .parchment-scroll {
        background: #fdf8eb;
        border: 2px solid #c4a482;
        border-left: 8px solid #8b5a2b;
        padding: 35px;
        border-radius: 8px;
        box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        width: 100%;
        box-sizing: border-box;
        margin-top: 20px;
        display: none; 
        animation: slideDown 0.4s ease-out;
    }
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .scroll-title {
        color: #734a26;
        margin-top: 0;
        font-family: 'Times New Roman', serif;
        font-size: 2rem;
        border-bottom: 2px dashed #c4a482;
        padding-bottom: 10px;
    }
    .badge-achievement {
        background-color: #3b5943;
        color: #fff;
        padding: 12px 18px;
        border-radius: 4px;
        display: inline-block;
        margin-top: 20px;
        font-size: 1.1rem;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
</style>

<div style="text-align: center; margin-bottom: 20px;">
    <h1 style="font-size: 2.5rem; font-family: 'Times New Roman', serif; color: #3e2a14;">🧭 Интерактивный Атлас Открытий</h1>
</div>

<div id="topHintPanel" class="hint-panel">
    <p class="hint-text">📜 Нажмите на любую золотую точку на карте, чтобы открыть летопись подвига</p>
</div>

<div class="map-container">
    <div class="map-wrapper">
        <svg class="world-svg" viewBox="0 0 1000 500" xmlns="http://w3.org">
            
            {% if map_image %}
            <image width="1000" height="500" href="{{ map_image }}" />
            {% endif %}

            <!-- ВСТАВЛЯЕМ ВСЕ НАШИ ОТДЕЛЬНЫЕ ТОЧКИ ИЗ ПАПКИ POINTS 🧩 -->
            {{ points_code }}

        </svg>
    </div>
</div>

<div id="infoScroll" class="parchment-scroll">
    <h3 id="scrollPlace" class="scroll-title">Название места</h3>
    <p style="font-size: 1.4rem; margin: 15px 0;"><strong>Великий исследователь:</strong> <span id="scrollName" style="color: #b32d19;"></span></p>
    <p id="scrollBio" style="line-height: 1.7; font-size: 1.2rem; color: #4a3b2c; font-family: 'Georgia', serif;"></p>
    <div id="scrollAchievement" class="badge-achievement"></div>
</div>

<script type="text/javascript">
    function showInfo(element) {
        var name = element.getAttribute('data-name');
        var place = element.getAttribute('data-place');
        var bio = element.getAttribute('data-bio');
        var achievement = element.getAttribute('data-achievement');

        document.getElementById('topHintPanel').style.display = 'none';

        document.getElementById('scrollPlace').innerText = "📍 " + place;
        document.getElementById('scrollName').innerText = name;
        document.getElementById('scrollBio').innerText = bio;
        document.getElementById('scrollAchievement').innerText = "📜 Летопись подвига: " + achievement;

        var scroll = document.getElementById('infoScroll');
        scroll.style.display = 'block';
        scroll.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>
{% endblock %}
